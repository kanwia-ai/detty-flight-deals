name: Send All Test Emails

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Email address to send test to'
        required: true
        default: 'kyra.atekwana@gmail.com'

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send all test emails
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_RECIPIENT: ${{ github.event.inputs.recipient }}
        run: |
          python << 'EOF'
          import os
          import smtplib
          import time
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          recipient = os.environ.get("TEST_RECIPIENT", "kyra.atekwana@gmail.com")
          smtp_email = os.environ.get("SMTP_EMAIL")
          smtp_password = os.environ.get("SMTP_PASSWORD")

          if not smtp_email or not smtp_password:
              print("ERROR: SMTP credentials not configured")
              exit(1)

          def send_email(subject, plain_body, html_body):
              msg = MIMEMultipart("alternative")
              msg["From"] = smtp_email
              msg["To"] = recipient
              msg["Subject"] = subject
              msg.attach(MIMEText(plain_body, "plain"))
              msg.attach(MIMEText(html_body, "html"))

              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
                  server.login(smtp_email, smtp_password)
                  server.sendmail(smtp_email, recipient, msg.as_string())
              print(f"  Sent to {recipient}")

          # ============================================================
          # 1. WELCOME EMAIL
          # ============================================================
          print("\n1. Sending WELCOME email...")
          from mvp0_sender import build_welcome_html, build_welcome_plain
          send_email(
              "[TEST] Welcome to Detty Flight Deals!",
              build_welcome_plain(""),
              build_welcome_html("")
          )
          time.sleep(2)

          # ============================================================
          # 2. DEAL ALERT - Mix of tiers
          # ============================================================
          print("\n2. Sending DEAL ALERT email (mix of tiers)...")
          from deal_finder import build_email_content

          sample_deals = [
              {
                  "origin": "JFK", "dest": "LOS", "dest_name": "Lagos",
                  "region": "West Africa", "price": 650,
                  "tier": "wow", "label": "WOW", "action": "Book immediately.",
                  "urgency": "high", "normal_price": 1200,
                  "departure": "2026-03-15", "return": "2026-03-25",
                  "url": "https://www.google.com/travel/flights?q=Flights%20from%20JFK%20to%20LOS",
              },
              {
                  "origin": "IAD", "dest": "ACC", "dest_name": "Accra",
                  "region": "West Africa", "price": 680,
                  "tier": "great", "label": "Great", "action": "Book soon.",
                  "urgency": "medium", "normal_price": 1100,
                  "departure": "2026-04-01", "return": "2026-04-11",
                  "url": "https://www.google.com/travel/flights?q=Flights%20from%20IAD%20to%20ACC",
              },
              {
                  "origin": "ATL", "dest": "ABJ", "dest_name": "Abidjan",
                  "region": "West Africa", "price": 950,
                  "tier": "good", "label": "Good", "action": "Worth booking.",
                  "urgency": "low", "normal_price": 1300,
                  "departure": "2026-04-10", "return": "2026-04-20",
                  "url": "https://www.google.com/travel/flights?q=Flights%20from%20ATL%20to%20ABJ",
              },
          ]

          subject, plain, html = build_email_content(sample_deals)
          send_email(f"[TEST] {subject}", plain, html)
          time.sleep(2)

          # ============================================================
          # 3. MISTAKE FARE ALERT (from RSS)
          # ============================================================
          print("\n3. Sending MISTAKE FARE ALERT email...")
          from mistake_fare_monitor import build_deals_html

          mistake_deals = [
              {
                  "destination": "Lagos",
                  "price": 450,
                  "tier": "wow",
                  "label": "WOW",
                  "action": "Book immediately.",
                  "normal_price": 1200,
                  "source": "Secret Flying",
                  "title": "US to Lagos from $450 roundtrip!",
                  "url": "https://www.secretflying.com/example",
                  "posted": "2 hours ago",
              }
          ]

          subject = "[TEST] 🚨 Rare price: Lagos from $450!"
          html = build_deals_html(mistake_deals)
          plain = "MISTAKE FARE ALERT\\n\\nLagos: $450 (usually $1200)\\nSource: Secret Flying"
          send_email(subject, plain, html)

          print("\n" + "=" * 50)
          print("All 3 test emails sent!")
          print("=" * 50)
          EOF
