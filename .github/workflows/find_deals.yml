name: Find Deals

on:
  # Run every 5 days at 10am UTC (6am ET / 3am PT)
  # Days 5, 10, 15, 20, 25, 30 = ~6 emails/month
  # Mistake fares bypass this limit (separate workflow)
  schedule:
    - cron: '0 10 */5 * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  find-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal finder
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: python deal_finder.py

      - name: Commit state files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_deals.json price_history.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update deal state [skip ci]"
          git push || true
