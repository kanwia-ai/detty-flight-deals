name: Find Deals

on:
  # Run daily at 10am UTC (6am ET / 3am PT)
  schedule:
    - cron: '0 10 * * *'

  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: detty-state-commit
  cancel-in-progress: false  # Queue runs, don't cancel -- state files need to be committed

permissions:
  contents: write  # Allow pushing state files back to repo

jobs:
  find-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Turso connection
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -c "
          from db import TursoClient
          client = TursoClient()
          if client._turso_available:
              print('Turso: Connected')
          else:
              print('Turso: Fallback mode (JSON only)')
          "
        continue-on-error: true

      - name: Run deal finder
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python deal_finder.py

      - name: Commit state files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add seen_deals.json price_history.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update deal state [skip ci]"
          git push || true
