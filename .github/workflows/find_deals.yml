name: Find Deals

on:
  # Run daily at 10am UTC (6am ET / 3am PT)
  schedule:
    - cron: '0 10 * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write  # Allow pushing state files back to repo

# Never two runs racing each other's state commits
concurrency:
  group: find-deals
  cancel-in-progress: false

jobs:
  find-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal finder
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python deal_finder.py

      - name: Reset failure streak
        if: success()
        run: python scripts/failure_sentinel.py --reset

      # The June 2026 breakage ran red for 3 weeks unnoticed. Never again:
      # bump the streak and email Kyra after 3 consecutive failures.
      - name: Failure sentinel
        if: failure()
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/failure_sentinel.py

      # Success-only: never persist seen_deals recorded by a run that died
      # before delivering its emails — a discarded runner re-alerts tomorrow,
      # which beats marking a deal "seen" that nobody was told about.
      - name: Commit state files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for f in seen_deals.json price_history.jsonl fastflights_health.json serpapi_quota.json failure_streak.json; do
            git add "$f" 2>/dev/null || true
          done
          git diff --staged --quiet || git commit -m "Update deal state [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push) || true

      - name: Commit failure streak
        if: failure()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add failure_streak.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update failure streak [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push) || true
