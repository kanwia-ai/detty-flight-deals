name: Validate Dual-Write Migration

on:
  schedule:
    # Run daily at 6 AM UTC during migration period
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validation
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/validate_dual_write.py

      - name: Report status
        if: failure()
        run: |
          echo "::warning::Dual-write validation found discrepancies"
          echo "Check workflow logs for details"
